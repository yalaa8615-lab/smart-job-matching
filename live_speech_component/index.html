
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 8px;
            font-family: Arial, sans-serif;
            background: transparent;
            color: inherit;
        }
        #status {
            font-size: 14px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="status">Ready to start speech recognition.</div>

    <script>
        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        let recognition = null;
        let active = false;
        let language = "en-US";
        let finalText = "";
        let interimText = "";
        let lastSent = "";
        let ready = false;

        function sendToStreamlit(type, extra = {}) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...extra
            }, "*");
        }

        function sendValue(status) {
            const value = {
                final: finalText,
                interim: interimText,
                status: status
            };

            const serialized = JSON.stringify(value);
            if (serialized === lastSent) return;

            lastSent = serialized;

            sendToStreamlit("streamlit:setComponentValue", {
                value: value,
                dataType: "json"
            });
        }

        function startListening(args) {
            if (!SpeechRecognition) {
                document.getElementById("status").textContent =
                    "Speech recognition is not supported. Use Chrome or Edge.";
                sendValue("unsupported");
                return;
            }

            const requestedLanguage = args.language || "en-US";

            if (active && recognition && language === requestedLanguage) {
                return;
            }

            stopListening();

            language = requestedLanguage;
            finalText = args.initial_text || "";
            interimText = "";
            lastSent = "";

            recognition = new SpeechRecognition();
            recognition.lang = language;
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            active = true;

            recognition.onstart = function () {
                document.getElementById("status").textContent =
                    "Listening... Speak now.";
                sendValue("listening");
            };

            recognition.onresult = function (event) {
                interimText = "";

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();

                    if (event.results[i].isFinal) {
                        finalText += (finalText ? " " : "") + transcript;
                    } else {
                        interimText += transcript;
                    }
                }

                document.getElementById("status").textContent =
                    "Listening...";

                sendValue("listening");
            };

            recognition.onerror = function (event) {
                document.getElementById("status").textContent =
                    "Recognition error: " + event.error;

                sendValue(event.error === "not-allowed"
                    ? "permission_denied"
                    : "error");
            };

            recognition.onend = function () {
                if (active) {
                    setTimeout(function () {
                        if (active && recognition) {
                            try {
                                recognition.start();
                            } catch (e) {}
                        }
                    }, 300);
                } else {
                    sendValue("stopped");
                }
            };

            try {
                recognition.start();
            } catch (error) {
                document.getElementById("status").textContent =
                    "Could not start. Press Start again.";
                sendValue("error");
            }
        }

        function stopListening() {
            active = false;

            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }

            recognition = null;
        }

        window.addEventListener("message", function (event) {
            const data = event.data;

            if (!data || data.type !== "streamlit:render") {
                return;
            }

            const args = data.args || {};

            if (args.active) {
                startListening(args);
            } else if (active) {
                stopListening();
            }

            sendToStreamlit("streamlit:setFrameHeight", {
                height: 45
            });
        });

        // Announce readiness immediately so Streamlit can send render data.
        sendToStreamlit("streamlit:componentReady", {
            apiVersion: 1
        });

        ready = true;
    </script>
</body>
</html>
